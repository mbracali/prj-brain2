[project]
name = "brain2"
version = "0.1.0"
description = "BRAIN2 — Personal Assistant Harness (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "watchdog>=4",
  "pyyaml>=6",
  "pypdf>=4",
  "mcp>=2",
  "httpx>=0.27",
  "keyring>=25",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "dnspython>=2.6",
  "ptyprocess>=0.7; sys_platform != 'win32'",
  "pywinpty>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brain2 = "brain2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
