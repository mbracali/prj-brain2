[project]
name = "brain2"
version = "0.1.0"
description = "BRAIN2 — Personal Assistant Harness (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "watchdog>=4",
  "pyyaml>=6",
  "pypdf>=4",
  "mcp>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
brain2 = "brain2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
